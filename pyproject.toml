[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
  venv|
  \.venv|
  __pycache__|
  build|
  dist|
  .*egg-info
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv", "build", "dist", "**/__pycache__"]
fix = true

[tool.ruff.lint]
extend-select = ["E","F","I","UP","B","C4","S","DTZ","PTH","BLE"]
ignore = ["S104"]

# ✅ per-file-ignores doit être une sous-table, pas une inline table
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                 # assert autorisé dans les tests
"app.py" = ["BLE001"]                # except Exception contrôlé
"utils/logger.py" = ["DTZ005","DTZ011"]  # pas de timezone imposée dans le logger

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "(venv|\\.venv|build|dist|.*egg-info|__pycache__)"
plugins = []

[[tool.mypy.overrides]]
module = ["markdown"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
