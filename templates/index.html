<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-Commerce Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- UI libs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />

  <!-- (optionnel) ton fichier CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    :root {
      --brand:#0d6efd;
      --bg:#f4f6fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
    }
    html,body{height:100%;}
    body{
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .chat-wrapper{
      max-width:900px;
      margin:24px auto;
      background:var(--card);
      border-radius:18px;
      box-shadow:0 10px 30px rgba(2,6,23,.08);
      display:flex;flex-direction:column;min-height:85vh;overflow:hidden;
    }
    .chat-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;background:var(--brand);color:#fff;
    }
    .chat-header h2{
      margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.2px;
      display:flex;align-items:center;gap:10px;
    }
    .chat-header img{width:28px;height:28px;}
    .signature{
      font-family:"Dancing Script",cursive;
      font-weight:700;font-size:1.1rem;margin-left:6px;opacity:.9;
      color:#ffe8b3;
    }
    #new-chat-btn{
      border:0;background:#fff;color:var(--brand);
      padding:8px 12px;border-radius:10px;font-weight:600;
      display:flex;align-items:center;gap:8px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;
    }
    .chat-body{
      padding:16px;flex:1;overflow:auto;background:#f9fbff;
    }
    .message{display:flex;margin:10px 0;}
    .message.user{justify-content:flex-end;}
    .message.bot{justify-content:flex-start;}
    .bubble{
      max-width:72%;padding:12px 14px;border-radius:14px;
      background:#e9efff;color:#0b1324;line-height:1.35;
      box-shadow:0 4px 14px rgba(2,6,23,.06);
      white-space:pre-wrap;word-break:break-word;
    }
    .message.user .bubble{
      background:#dff6e3;color:#0f2414;
    }
    .typing{display:inline-flex;gap:4px;align-items:center}
    .typing span{
      width:6px;height:6px;border-radius:50%;background:#9aa7bd;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2){animation-delay:.15s}
    .typing span:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.6}
      40%{transform:translateY(-6px);opacity:1}
    }
    .chat-footer{
      display:flex;gap:10px;padding:12px;background:#fff;border-top:1px solid #eef2ff;
    }
    #text{
      flex:1;border:1px solid #d0d8ee;border-radius:20px;
      padding:12px 16px;outline:none;
      box-shadow:inset 0 1px 2px rgba(2,6,23,.03);
    }
    .chat-footer button[type="submit"]{
      width:46px;height:46px;border-radius:50%;border:0;
      background:var(--brand);color:#fff;font-size:1.1rem;
      display:inline-flex;align-items:center;justify-content:center;
      box-shadow:0 6px 16px rgba(13,110,253,.3);cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header class="chat-header">
      <div class="d-flex align-items-center gap-2">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="Bot" />
        <h2>
          E-Commerce Chatbot <span class="signature">by Rida Bayi</span>
        </h2>
      </div>
      <button id="new-chat-btn"><i class="fas fa-sync-alt"></i> New Chat</button>
    </header>

    <main class="chat-body" id="chat-body">
      <!-- messages -->
    </main>

    <form id="message-form" class="chat-footer" autocomplete="off">
      <input id="text" name="msg" type="text" placeholder="Type your message..." required />
      <button type="submit" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    console.log('DOM ready');
    let sessionId = "session-" + Date.now();

    function appendMessage(sender, text) {
      const msg = `
        <div class="message ${sender}">
          <div class="bubble">${text}</div>
        </div>`;
      $('#chat-body').append(msg);
      $('#chat-body').scrollTop($('#chat-body')[0].scrollHeight);
    }

    $('#message-form').on('submit', function (e) {
      e.preventDefault();
      const rawText = $('#text').val().trim();
      console.log('submit', rawText);
      if (!rawText) return;

      appendMessage('user', rawText);
      $('#text').val('');
      appendMessage('bot', '<div class="typing"><span></span><span></span><span></span></div>');

      $.ajax({
        url: '/get',
        type: 'POST',
        dataType: 'text',                // le backend renvoie du TEXTE
        data: { msg: rawText, session_id: sessionId },
        success: function (data) {
          console.log('ajax success', data);
          $('#chat-body .typing').parent().remove();
          // effet "machine à écrire"
          let i = 0, botText = '';
          const interval = setInterval(() => {
            botText += data.charAt(i) || '';
            if (i === 0) appendMessage('bot', '');
            $('#chat-body .message.bot:last-child .bubble').html(botText);
            i++;
            if (i >= data.length) clearInterval(interval);
          }, 15);
        },
        error: function (xhr) {
          console.error('ajax error', xhr.status, xhr.responseText);
          $('#chat-body .typing').parent().remove();
          appendMessage('bot', '❌ Error occurred. Please try again.');
        }
      });
    });

    $('#new-chat-btn').on('click', function () {
      $('#chat-body').empty();
      sessionId = "session-" + Date.now();
    });
  });
  </script>
</body>
</html>
