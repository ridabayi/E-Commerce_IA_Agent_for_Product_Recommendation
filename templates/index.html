<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>E-Commerce Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- UI libs -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />

  <!-- Optional: your CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

  <style>
    :root {
      --brand: #0d6efd;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --bubble-user: #dff6e3;
      --bubble-bot: #eef3ff;
      --border: #e5e9f5;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrapper {
      max-width: 980px;
      margin: 24px auto;
      min-height: 88vh;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .08);
      display: flex;
      flex-direction: column;
    }

    header.appbar {
      background: var(--brand);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo-title img {
      width: 28px;
      height: 28px
    }

    .logo-title h1 {
      font-size: 1.05rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: .2px
    }

    .signature {
      font-family: "Dancing Script", cursive;
      font-weight: 700;
      margin-left: 6px;
      color: #ffe8b3
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .toolbar .btn {
      border: 0
    }

    main.chat {
      padding: 18px;
      flex: 1;
      overflow: auto;
      background: #f9fbff;
    }

    .message {
      display: flex;
      margin: 10px 0;
      gap: 8px
    }

    .message .time {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 2px
    }

    .message.user {
      justify-content: flex-end
    }

    .bubble {
      max-width: 75%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.45;
      box-shadow: 0 4px 14px rgba(2, 6, 23, .06);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--bubble-user);
      color: #0f2414
    }

    .message.bot .bubble {
      background: var(--bubble-bot);
      color: #0b1324
    }

    .bubble .actions {
      display: flex;
      gap: 8px;
      margin-top: 6px
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9aa7bd;
      animation: bounce 1.2s infinite ease-in-out
    }

    .typing span:nth-child(2) {
      animation-delay: .15s
    }

    .typing span:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: .6
      }

      40% {
        transform: translateY(-6px);
        opacity: 1
      }
    }

    form.composer {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    #text {
      flex: 1;
      border: 1px solid #d0d8ee;
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(2, 6, 23, .03);
      resize: none;
      min-height: 48px;
      max-height: 160px;
      overflow: auto;
    }

    .composer .btn-send {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 0;
      background: var(--brand);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 6px 16px rgba(13, 110, 253, .3);
    }

    /* Dark mode */
    .dark {
      --bg: #0b1220;
      --card: #0f172a;
      --text: #e5edff;
      --muted: #9fb0d7;
      --bubble-user: #14322a;
      --bubble-bot: #17223a;
      --border: #1f2a44;
      background: var(--bg);
      color: var(--text);
    }

    .dark main.chat {
      background: #0c1426
    }

    .dark header.appbar {
      background: #0e3b86
    }

    .dark .composer {
      background: #0f172a;
      border-color: var(--border)
    }

    .dark #text {
      background: #0b1220;
      color: var(--text);
      border-color: #1e2b4a
    }
  </style>
</head>

<body>
  <div class="wrapper" id="app">
    <header class="appbar">
      <div class="logo-title">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="Bot" />
        <h1>E-Commerce Chatbot <span class="signature">by Rida Bayi</span></h1>
      </div>
      <div class="toolbar">
        <button id="btn-dark" class="btn btn-light btn-sm" title="Toggle theme"><i
            class="fa-solid fa-moon"></i></button>
        <button id="btn-export" class="btn btn-light btn-sm" title="Export chat"><i class="fa-solid fa-file-export"></i>
          Export</button>
        <button id="btn-new" class="btn btn-light btn-sm"><i class="fa-solid fa-rotate"></i> New Chat</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite" aria-busy="false">
      <!-- Messages will appear here -->
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="text" name="msg" placeholder="Type your message… (Enter to send • Shift+Enter = newline)"
        required></textarea>
      <button type="submit" class="btn-send" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>

  <!-- Toast container -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="toast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive"
      aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toast-body">Error</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Markdown renderer (optional, safe for plain text too) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    // --- State ---
    let sessionId = localStorage.getItem("sessionId") || ("session-" + Date.now());
    localStorage.setItem("sessionId", sessionId);
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('text');
    const composer = document.getElementById('composer');
    const toast = new bootstrap.Toast(document.getElementById('toast'));
    const toastBody = document.getElementById('toast-body');
    const darkBtn = document.getElementById('btn-dark');
    const newBtn = document.getElementById('btn-new');
    const exportBtn = document.getElementById('btn-export');

    let abortController = null;
    const history = []; // [{role:'user'|'bot', text, ts}]

    // --- Theme ---
    (function initTheme() {
      const saved = localStorage.getItem('theme') || 'light';
      if (saved === 'dark') document.body.classList.add('dark');
    })();
    darkBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });

    // --- Utilities ---
    function now() {
      const d = new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

    function renderMarkdown(text) {
      try { return marked.parse(text); } catch { return text; }
    }

    function addMessage(role, text) {
      const html = `
        <div class="message ${role}">
          <div>
            <div class="bubble">${role === 'bot' ? renderMarkdown(text) : escapeHtml(text)}</div>
            <div class="d-flex justify-content-${role === 'user' ? 'end' : 'start'} gap-2 mt-1">
              <span class="time">${now()}</span>
              <button class="btn btn-sm btn-outline-secondary btn-copy" data-text="${encodeURIComponent(text)}" title="Copy"><i class="fa-regular fa-copy"></i></button>
            </div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      history.push({ role, text, ts: Date.now() });
    }

    function addTyping() {
      const html = `
        <div class="message bot" id="typing">
          <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }
    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function showError(msg) {
      toastBody.textContent = msg || 'An error occurred.';
      toast.show();
    }

    // copy buttons (event delegation)
    chatEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-copy');
      if (!btn) return;
      const text = decodeURIComponent(btn.dataset.text || '');
      navigator.clipboard.writeText(text).catch(() => { });
      btn.innerHTML = '<i class="fa-solid fa-check"></i>';
      setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1200);
    });

    // --- New Chat / Export ---
    newBtn.addEventListener('click', () => {
      chatEl.innerHTML = '';
      history.length = 0;
      sessionId = "session-" + Date.now();
      localStorage.setItem("sessionId", sessionId);
    });

    exportBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ sessionId, history }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `chat_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // --- Composer UX ---
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        composer.requestSubmit();
      }
    });

    // --- Submit handler ---
    composer.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawText = inputEl.value.trim();
      if (!rawText) return;

      addMessage('user', rawText);
      inputEl.value = '';
      addTyping();

      // Abort any previous request
      if (abortController) abortController.abort();
      abortController = new AbortController();

      try {
        // Use fetch with FormData (still POST form fields as your backend expects)
        const fd = new FormData();
        fd.append('msg', rawText);
        fd.append('session_id', sessionId);

        const res = await fetch('/get', { method: 'POST', body: fd, signal: abortController.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();
        removeTyping();
        // typewriter effect (stream-like)
        let out = '';
        addMessage('bot', ''); // placeholder
        const placeholder = chatEl.querySelector('.message.bot:last-child .bubble');
        const step = () => new Promise(r => setTimeout(r, 8));
        for (let i = 0; i < text.length; i++) {
          out += text[i];
          placeholder.innerHTML = renderMarkdown(out);
          await step();
        }
        // update history properly
        history[history.length - 1].text = out;
      } catch (err) {
        console.error(err);
        removeTyping();
        addMessage('bot', '❌ Error occurred. Please try again.');
        showError(err.message || 'Network error');
      }
    });
  </script>
</body>

</html>
