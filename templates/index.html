<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-Commerce Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap (utile pour les boutons/containers, pas obligatoire) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Police pour la signature -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />

  <!-- Ton CSS séparé -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat-wrapper" id="app">
    <!-- Header -->
    <div class="chat-header">
      <div class="brand">
        <img class="logo" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="Bot" />
        <h2>E-Commerce Chatbot</h2>
      </div>

      <!-- Profil -->
      <div class="profile-chip">
        <img src="{{ url_for('static', filename='RidaBayi.jpg') }}" alt="Rida Bayi">
        <span class="signature">Rida Bayi</span>
      </div>


      <!-- Actions (SVG inline) -->
      <div class="actions">
        <!-- Theme -->
        <button id="btn-dark" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 0a7 7 0 1 0 7 10.004A6 6 0 0 1 6 0z"></path>
          </svg>
        </button>

        <!-- Export -->
        <button id="btn-export" title="Export chat" aria-label="Export chat">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 1a.5.5 0 0 0 0 1H8v4a1 1 0 0 0 1 1h4v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6h1v7h10V7H9a2 2 0 0 1-2-2V2H3.5z"/>
            <path d="M10.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 1 1-.708.708L10.5 1.707 9.354 2.854a.5.5 0 1 1-.708-.708l1.5-1.5z"/>
          </svg>
          Export
        </button>

        <!-- New Chat -->
        <button id="btn-new" title="New chat" aria-label="New chat">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 1 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 0a.5.5 0 0 1 .5.5v3.793l1.146-1.147a.5.5 0 1 1 .708.708L8.354 5.854a.5.5 0 0 1-.708 0L5.646 3.854a.5.5 0 1 1 .708-.708L7.5 4.293V.5A.5.5 0 0 1 8 0z"/>
          </svg>
          New Chat
        </button>
      </div>
    </div>

    <!-- Chat body -->
    <div id="chat" class="chat-body" aria-live="polite" aria-busy="false"></div>

    <!-- Footer -->
    <form id="composer" class="chat-footer" autocomplete="off">
      <label for="text" class="visually-hidden">Your message</label>
      <input id="text" name="msg" placeholder="Type your message… (Enter to send • Shift+Enter = newline)" required />
      <button type="submit" class="btn-send" aria-label="Send">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.5 14a.5.5 0 0 1-.944-.06L8.21 9.79 1.374 6.47a.5.5 0 0 1 .06-.944l14-5.5a.5.5 0 0 1 .42.12zM2.64 6.14l5.406 2.53a.5.5 0 0 1 .264.293l1.51 4.53L14.7 1.3 2.64 6.14z"/>
        </svg>
      </button>
    </form>
  </div>

  <!-- Libs JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>

  <script>
    /* ======================= State ======================= */
    let sessionId = localStorage.getItem("sessionId") || ("session-" + Date.now());
    localStorage.setItem("sessionId", sessionId);

    const chatEl   = document.getElementById('chat');
    const inputEl  = document.getElementById('text');
    const composer = document.getElementById('composer');

    const darkBtn   = document.getElementById('btn-dark');
    const newBtn    = document.getElementById('btn-new');
    const exportBtn = document.getElementById('btn-export');

    let abortController = null;
    const history = [];

    /* ======================= Theme ======================= */
    (function initTheme(){
      const saved = localStorage.getItem('theme'); // "dark" | "light" | null
      document.body.classList.toggle('dark', saved === 'dark');
    })();

    darkBtn.addEventListener('click', () => {
      const willBeDark = !document.body.classList.contains('dark');
      document.body.classList.toggle('dark', willBeDark);
      localStorage.setItem('theme', willBeDark ? 'dark' : 'light');
    });

    /* ======================= Utils ======================= */
    const now = () => new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const scrollToBottom = () => { chatEl.scrollTop = chatEl.scrollHeight; };
    const escapeHtml = (s) => (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const renderMarkdown = (text) => {
      try { return DOMPurify.sanitize(marked.parse(text ?? ""), {USE_PROFILES:{html:true}}); }
      catch { return escapeHtml(text ?? ""); }
    };

    function addMessage(role, text){
      const safe = role === 'bot' ? renderMarkdown(text) : escapeHtml(text);
      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;
      wrap.innerHTML = `
        <div>
          <div class="bubble">${safe}</div>
          <div class="meta-row" style="justify-content:${role==='user'?'flex-end':'flex-start'}">
            <span>${now()}</span>
            <button class="btn-copy" data-text="${encodeURIComponent(text || '')}" title="Copy">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 1a2 2 0 0 0-2 2v9h1V3a1 1 0 0 1 1-1h7V1H4z"/>
                <path d="M6 4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6z"/>
              </svg>
            </button>
          </div>
        </div>`;
      chatEl.appendChild(wrap);
      scrollToBottom();
      history.push({ role, text, ts: Date.now() });
    }

    function addTyping(){
      const el = document.createElement('div');
      el.id='typing'; el.className='message bot';
      el.innerHTML = `<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
      chatEl.appendChild(el);
      scrollToBottom();
    }
    const removeTyping = () => document.getElementById('typing')?.remove();

    // Copy (delegation)
    chatEl.addEventListener('click', (e)=>{
      const btn = e.target.closest('.btn-copy'); if(!btn) return;
      const text = decodeURIComponent(btn.dataset.text || '');
      navigator.clipboard.writeText(text).catch(()=>{});
      const ICON_CHECK = '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.485 1.929a1.5 1.5 0 0 1 0 2.122l-6.657 6.657-3.182-3.182a1.5 1.5 0 1 1 2.122-2.122l1.06 1.06 5.596-5.595a1.5 1.5 0 0 1 2.122 0z"/></svg>';
      const ICON_CLIP = '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1a2 2 0 0 0-2 2v9h1V3a1 1 0 0 1 1-1h7V1H4z"/><path d="M6 4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6z"/></svg>';
      btn.innerHTML = ICON_CHECK;
      setTimeout(()=> btn.innerHTML = ICON_CLIP, 1200);
    });

    // New / Export
    newBtn.addEventListener('click', ()=>{
      chatEl.innerHTML = '';
      history.length = 0;
      sessionId = "session-" + Date.now();
      localStorage.setItem("sessionId", sessionId);
    });

    exportBtn.addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify({ sessionId, history }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `chat_${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Composer UX
    inputEl.addEventListener('keydown', (e)=>{
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); composer.requestSubmit(); }
    });

    // Submit -> /get
    composer.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const rawText = inputEl.value.trim();
      if (!rawText) return;

      addMessage('user', rawText);
      inputEl.value = '';
      addTyping();

      if (abortController) abortController.abort();
      abortController = new AbortController();

      try{
        const fd = new FormData();
        fd.append('msg', rawText);
        fd.append('session_id', sessionId);

        const res = await fetch('/get', { method:'POST', body: fd, signal: abortController.signal });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();
        removeTyping();

        // typewriter
        addMessage('bot','');
        const bubble = chatEl.querySelector('.message.bot:last-child .bubble');
        let out=''; const step=()=>new Promise(r=>setTimeout(r,8));
        for (let i=0;i<text.length;i++){
          out += text[i];
          bubble.innerHTML = renderMarkdown(out);
          await step();
        }
        history[history.length-1].text = out;
      }catch(err){
        console.error(err);
        removeTyping();
        addMessage('bot','❌ Error occurred. Please try again.');
      }
    });
  </script>
</body>
</html>
